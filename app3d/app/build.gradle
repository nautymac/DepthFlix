plugins { id 'com.android.application' }

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.nauty.p3d'
    compileSdk 34

    defaultConfig {
        applicationId "com.nauty.p3d"
        minSdk 24             // youtubedl-android 요구치 (실기는 훨씬 위라 문제 없다)
        targetSdk 28          // 기기가 API 26 — 레거시 저장소 접근 유지
        versionCode 6
        versionName "1.3.2"
        ndk { abiFilters 'arm64-v8a' }   // 기기가 arm64. libVLC 가 ABI 당 ~30MB 라 하나만 담는다
    }

    flavorDimensions.add("device")

    productFlavors {
        // Lume Pad 2. Original target — connector is whatever LUMEPAD2-PORT.md's
        // extraction produced (CNSDK 0.6.200). No suffix: this is the identity the
        // app has always shipped under, so existing installs keep their data.
        lumepad {
            dimension "device"
        }

        // Red Magic Tablet 3D Explorer Edition (model NP02J, codename K68). Same Leia
        // lightfield panel family, confirmed working on real hardware, but it ships a
        // newer CNSDK line on its system services (0.10.40/0.10.18/0.5.50 vs Lume Pad
        // 2's 0.6.200) and needs its own matching connector — the two are not
        // interchangeable (LeiaSDK.Delegate itself changed from an interface to an
        // abstract class between these lines; see Panel.java's anonymous Delegate
        // for why the shared code has to stay agnostic to that).
        redmagic {
            dimension "device"
            applicationIdSuffix ".redmagic"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        // smbj 가 java.time 을 쓴다. minSdk 21 이라 데스슈가링이 있어야 링크된다.
        coreLibraryDesugaringEnabled true
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        release {
            // keystore.properties 와 .jks 는 저장소에 넣지 않는다 (.gitignore 처리)
            if (keystoreProps["storeFile"] != null) {
                storeFile     file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias      keystoreProps["keyAlias"]
                keyPassword   keystoreProps["keyPassword"]
            }
        }
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            if (keystoreProps["storeFile"] != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint { abortOnError false }
}

configurations.all {
    resolutionStrategy {
        // dcerpc 0.12.13 가 smbj 0.12.2 를 보고 만들어져 있다. Gradle 기본값(최고
        // 버전 승리)이 이걸 0.13.0 으로 올려 버리면 Connection.getConfig() 가 없어
        // NoSuchMethodError 로 런타임에 죽는다 (실기 SMB 로그인에서 실제로 겪었다).
        force 'com.hierynomus:smbj:0.12.2'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation project(':ffmpeg')          // AC3/E-AC3/DTS/TrueHD 소프트웨어 디코딩

    // SMB 재생 (HANDOFF 1-②). Apache-2.0 — 이 저장소의 MIT 와 함께 배포해도 된다.
    // jcifs-ng 는 LGPL 이라 배포 조건이 달라 피했다. 버전은 아래 resolutionStrategy 로
    // 0.12.2 에 고정한다 (dcerpc 와 궁합 — 그 이유는 그쪽 주석 참고).
    implementation 'com.hierynomus:smbj:0.12.2'
    // 로그인 정보만으로 공유 목록을 받아오는 데 쓴다 (SRVSVC NetrShareEnum, IPC$ 위의
    // DCE/RPC). smbj 는 이 RPC 계층이 없어서 따로 붙인다. BSD-3-Clause.
    implementation 'com.rapid7.client:dcerpc:0.12.13'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // 유튜브(실시간 포함) 링크 재생. 파이썬 3.8 + yt-dlp 실행 파일을 통째로 안드로이드
    // 네이티브 라이브러리로 안고 있는 라이브러리다 — 서버 없이 기기 안에서 바로
    // 스트림 주소를 뽑는다. ffmpeg 모듈(별도 아티팩트, 위의 project(':ffmpeg') 와는
    // 다른 것)은 뺐다 — 우리는 --dump-json 으로 정보만 뽑을 뿐 합치기/후처리를
    // 안 시키므로 없어도 된다. 있으면 APK 가 35MB 이상 커진다(실측).
    // Unlicense — 배포 조건 문제없다. minSdk 24 를 요구해 위에서 올렸다.
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    // youtubedl-android 가 --dump-json 결과를 파싱하는 데 쓰는 것과 같은 버전.
    // 그쪽은 implementation 으로 감춰 둬서, language·subtitles 같은 원시 필드를
    // 직접 읽으려면(YouTube.java) 우리 쪽에서 따로 컴파일 클래스패스에 올려야 한다.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.1'

    // Leia CNSDK — 기기별로 다른 커넥터(jar + jniLibs + assets/cnsdk.version)를 쓴다.
    // lumepad 는 기기의 com.moonlight.leia APK 에서 꺼낸 것(꺼내는 방법은
    // LUMEPAD2-PORT.md 참고), redmagic 은 그 기기 자체의 ZTE/Leia 순정 앱에서 꺼낸
    // 것 — 둘 다 재배포할 수 없어서 저장소에 넣지 않았다. 같은 이유로
    // app/src/<flavor>/jniLibs/ 의 .so 파일들도 저장소에 없다.
    // app/src/main/assets/shaders/ 는 두 기기가 지금까지는 같은 것을 써서 공용으로
    // 뒀다 — RedMagic 실기에서 위빙이 이상하면 여기부터 의심할 것.
    lumepadImplementation fileTree(dir: 'libs/lumepad', include: ['leia-cnsdk*.jar'])
    redmagicImplementation fileTree(dir: 'libs/redmagic', include: ['leia-cnsdk*.jar'])
}
